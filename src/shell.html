<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>曝光報告</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#6b7280;--line:#e5e7eb;--soft:#f6f7f9;--accent:#ff5b00;--accent-soft:#fff1e8;--ok:#15803d;--ok-soft:#ecfdf3;--warn:#a15c07;--warn-soft:#fffaeb;--bad:#b42318;--bad-soft:#fef3f2}
:root[data-theme="dark"]{--bg:#1b1c1f;--fg:#e8e8ea;--muted:#a1a1aa;--line:#33343a;--soft:#232428;--accent:#ff7a33;--accent-soft:#3a2419;--ok:#4ade80;--ok-soft:#14261b;--warn:#fbbf24;--warn-soft:#2d2410;--bad:#f87171;--bad-soft:#2d1716}
*{box-sizing:border-box}
body{margin:0;padding:16px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px;background:var(--soft)}
.card .label{font-size:12px;color:var(--muted);margin:0 0 2px}
.card .title{font-weight:600;margin:0;word-break:break-word}
.card .meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);text-align:center;margin:0 0 14px}
button{width:100%;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:15px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
#steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
#steps li{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
#steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
#steps li.active{color:var(--fg)}#steps li.active::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
#steps li.done{color:var(--fg)}#steps li.done::before{border-color:var(--ok);background:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#steps li.active::before{animation:none}}
.status{margin:14px 0 0;padding:10px 12px;border-radius:8px;font-size:13px}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.warn{background:var(--warn-soft);color:var(--warn)}.status.bad{background:var(--bad-soft);color:var(--bad)}
#result{margin:12px 0 0}#file-name{font-size:12px;color:var(--muted);margin:0 0 8px;word-break:break-all}
#thumbs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 0}#thumbs img{width:100%;border:1px solid var(--line);border-radius:4px}
[hidden]{display:none!important}
</style></head><body>
<h1 id="app-title">曝光報告</h1>
<p class="sub">把專案的曝光截圖和連結整理成一份 PPT</p>
<div id="empty" class="empty">讀取中…</div>
<div id="card" class="card" hidden>
  <p class="label">目前選取的專案</p>
  <p class="title" id="rec-title"></p>
  <p class="meta" id="rec-meta"></p>
</div>
<button id="go" class="primary" disabled>產生報告</button>
<p class="hint" id="out-hint"></p>
<ul id="steps" hidden>
  <li data-k="read" id="step-read">讀取曝光需求</li>
  <li data-k="download" id="step-download">下載截圖</li>
  <li data-k="build">產生簡報</li>
  <li data-k="save">存回表格</li>
</ul>
<div id="status" class="status" hidden></div>
<div id="result" hidden>
  <p id="file-name"></p>
  <button id="dl">下載到電腦</button>
</div>
<div id="thumbs"></div>
<script>/*BUNDLE*/</script>
</body></html>
